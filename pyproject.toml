[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "algobench"
version = "0.2.0"
description = "Algorithm Correctness Benchmark Suite"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jaskaran Singh" }]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[tool.setuptools.packages.find]
include = ["algobench*"]
